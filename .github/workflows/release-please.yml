on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release # Required to reference outputs
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please/release-please-config.json
          manifest-file: .release-please/.release-please-manifest.json

  inno-compile:
    runs-on: windows-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
        - uses: actions/checkout@v4

        - uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
          with:
            path: GMLInstaller.iss
            options: '/F"Machine Party Mod-Loader Installer ${{ needs.release-please.outputs.version }}"'

        - uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ needs.release-please.outputs.tag_name }}
            files: Output/*.exe